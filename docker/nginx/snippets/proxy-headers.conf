# Shared edge headers. No X-Frame-Options: DENY/SAMEORIGIN — VK Mini Apps
# embed the client in an iframe on vk.com / vk.ru.
# CSP is limited to frame-ancestors so it does not block the VK JS SDK later.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-XSS-Protection "0" always;
add_header Content-Security-Policy "frame-ancestors 'self' https://vk.com https://*.vk.com https://vk.ru https://*.vk.ru https://web.vk.me;" always;

proxy_hide_header X-Frame-Options;
