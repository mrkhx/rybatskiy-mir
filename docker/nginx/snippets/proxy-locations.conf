location /.well-known/acme-challenge/ {
  root /var/www/certbot;
  default_type text/plain;
  try_files $uri =404;
}

location = /health/live {
  access_log off;
  set $upstream_backend http://backend:3000;
  proxy_pass $upstream_backend;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 5s;
}

location = /health/ready {
  access_log off;
  set $upstream_backend http://backend:3000;
  proxy_pass $upstream_backend;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 5s;
}

location = /health {
  access_log off;
  set $upstream_backend http://backend:3000;
  proxy_pass $upstream_backend;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 5s;
}

location /api/ {
  # Trailing slash strips the /api/ prefix. Do not use a variable here.
  proxy_pass http://backend:3000/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
}

location = /api {
  return 308 /api/;
}

location /socket.io/ {
  set $upstream_backend http://backend:3000;
  proxy_pass $upstream_backend;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 86400s;
}

location = /admin {
  return 308 /admin/;
}

location /admin/ {
  set $upstream_admin http://admin:80;
  proxy_pass $upstream_admin;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
}

location / {
  set $upstream_frontend http://frontend:80;
  proxy_pass $upstream_frontend;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Connection "";
}
