# HTTP-only edge. Used until Let's Encrypt certs exist for STAGING_DOMAIN.
# Current staging by public IP keeps working.

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  client_max_body_size 2m;
  client_body_timeout 15s;
  send_timeout 60s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/snippets/proxy-headers.conf;
  include /etc/nginx/snippets/proxy-locations.conf;
}
