map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  client_max_body_size 2m;
  client_body_timeout 15s;
  send_timeout 60s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-XSS-Protection "0" always;

  # Docker embedded DNS — re-resolve service IPs after recreates.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /health/live {
    access_log off;
    set $upstream_backend http://backend:3000;
    proxy_pass $upstream_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
  }

  location = /health/ready {
    access_log off;
    set $upstream_backend http://backend:3000;
    proxy_pass $upstream_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
  }

  location = /health {
    access_log off;
    set $upstream_backend http://backend:3000;
    proxy_pass $upstream_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
  }

  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    set $upstream_backend http://backend:3000;
    # Variable proxy_pass ignores rewrite unless the URI is explicit.
    proxy_pass $upstream_backend$uri$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  location = /api {
    return 308 /api/;
  }

  location /socket.io/ {
    set $upstream_backend http://backend:3000;
    proxy_pass $upstream_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 86400s;
  }

  location = /admin {
    return 308 /admin/;
  }

  location /admin/ {
    # Keep the /admin/ prefix. Admin nginx maps it onto document root
    # (Vite base is /admin/; files are still emitted at /).
    set $upstream_admin http://admin:80;
    proxy_pass $upstream_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  location / {
    set $upstream_frontend http://frontend:80;
    proxy_pass $upstream_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
}
