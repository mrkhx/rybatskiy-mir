# TLS edge. Entrypoint substitutes __STAGING_DOMAIN__ when certs exist.
# HTTP :80 for the domain redirects to HTTPS except ACME and health
# (health stays on :80 so compose/deploy localhost checks keep working).
# Requests to the raw IP on :80 still get the HTTP app (default_server).

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  client_max_body_size 2m;
  client_body_timeout 15s;
  send_timeout 60s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/snippets/proxy-headers.conf;
  include /etc/nginx/snippets/proxy-locations.conf;
}

server {
  listen 80;
  server_name __STAGING_DOMAIN__;
  server_tokens off;

  resolver 127.0.0.11 valid=10s ipv6=off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /health/live {
    access_log off;
    set $upstream_backend http://backend:3000;
    proxy_pass $upstream_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
  }

  location = /health/ready {
    access_log off;
    set $upstream_backend http://backend:3000;
    proxy_pass $upstream_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 5s;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name __STAGING_DOMAIN__;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/__STAGING_DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__STAGING_DOMAIN__/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_tickets off;

  client_max_body_size 2m;
  client_body_timeout 15s;
  send_timeout 60s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss;

  resolver 127.0.0.11 valid=10s ipv6=off;

  include /etc/nginx/snippets/proxy-headers.conf;
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  include /etc/nginx/snippets/proxy-locations.conf;
}
