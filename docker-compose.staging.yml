# Staging stack for a single VPS. Images come from GHCR — no source tree required.
# Usage:
#   IMAGE_TAG=<sha> docker compose --env-file .env.staging -f docker-compose.staging.yml pull
#   IMAGE_TAG=<sha> docker compose --env-file .env.staging -f docker-compose.staging.yml up -d --wait
# Public: HTTP_PORT (80) and HTTPS_PORT (443). TLS turns on automatically
# when ./letsencrypt/live/$STAGING_DOMAIN/fullchain.pem exists.
# PostgreSQL, Redis and backend stay on internal networks.

name: rybatskiy-mir-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: ${PROXY_IMAGE:-ghcr.io/mrkhx/rybatskiy-mir-proxy}:${IMAGE_TAG:-staging}
    pull_policy: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-}
    volumes:
      - ${LETSENCRYPT_DIR:-./letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WWW_DIR:-./certbot-www}:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
    networks:
      - front
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/mrkhx/rybatskiy-mir-frontend}:${IMAGE_TAG:-staging}
    pull_policy: always
    networks:
      - front
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/mrkhx/rybatskiy-mir-admin}:${IMAGE_TAG:-staging}
    pull_policy: always
    networks:
      - front
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/mrkhx/rybatskiy-mir-backend}:${IMAGE_TAG:-staging}
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rybatskiy}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rybatskiy_mir}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN}
      ALLOW_DEV_AUTH: "false"
      VK_APP_ID: ${VK_APP_ID:-}
      VK_APP_SECRET: ${VK_APP_SECRET:-}
      VK_API_VERSION: ${VK_API_VERSION:-5.199}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - front
      - data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rybatskiy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rybatskiy_mir}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "no"
      - --save
      - ""
      - --protected-mode
      - "yes"
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    volumes:
      - ${LETSENCRYPT_DIR:-./letsencrypt}:/etc/letsencrypt
      - ${CERTBOT_WWW_DIR:-./certbot-www}:/var/www/certbot

networks:
  front:
  data:

volumes:
  postgres_data:
