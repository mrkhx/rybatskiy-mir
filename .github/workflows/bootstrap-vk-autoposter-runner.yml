# TEMPORARY inspect-only. Delete after verification.
# Does NOT deploy the game. Does NOT mint runner tokens. Does NOT install.

name: Bootstrap VK Autoposter runner

on:
  workflow_dispatch:

concurrency:
  group: bootstrap-vk-autoposter-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: inspect-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - name: Check SSH secrets exist (values not printed)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$STAGING_HOST" ]; then echo "STAGING_HOST is empty"; missing=1; fi
          if [ -z "$STAGING_USER" ]; then echo "STAGING_USER is empty"; missing=1; fi
          if [ -z "$STAGING_SSH_KEY" ]; then echo "STAGING_SSH_KEY is empty"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Cannot SSH. Refusing to continue."
            exit 1
          fi
          echo "SSH secret names are present. Values not logged."

      - name: Inspect VPS (read-only)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 3m
          script: |
            set -euo pipefail
            echo "===== INSPECT BEGIN ====="
            echo "whoami=$(whoami)"
            uname -a
            echo "----- docker ps -----"
            docker ps
            echo "----- docker compose ls -----"
            docker compose ls
            echo "----- game health localhost:80 -----"
            echo -n "live="
            curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/health/live || echo fail
            echo
            echo -n "ready="
            curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/health/ready || echo fail
            echo
            echo "----- docker ids -----"
            docker ps -aq | sort
            echo "----- runner systemd -----"
            UNIT=actions.runner.mrkhx-vk-autoposter.vk-autoposter-vps.service
            systemctl is-enabled "$UNIT" || true
            systemctl is-active "$UNIT" || true
            systemctl show "$UNIT" -p Id,ActiveState,SubState,UnitFileState,MainPID,User,FragmentPath,WorkingDirectory --no-pager || true
            echo "----- runner processes -----"
            ps -o user,pid,ppid,cmd -C Runner.Listener || true
            echo "----- runner dir -----"
            ls -ld /home/deploy/actions-runner-vk-autoposter || true
            echo "===== INSPECT END ====="
