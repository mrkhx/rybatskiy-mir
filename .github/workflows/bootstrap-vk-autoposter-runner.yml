# TEMPORARY one-shot workflow. Delete after vk-autoposter runner is Idle.
# Does NOT deploy Рыбацкий Мир. Does NOT run docker compose of the game.
# Does NOT touch /opt/rybatskiy-mir. Does NOT start vk-autoposter compose.
#
# Uses existing staging SSH secrets of THIS repository only.
# Does not copy those secrets to mrkhx/vk-autoposter.

name: Bootstrap VK Autoposter runner

on:
  workflow_dispatch:

concurrency:
  group: bootstrap-vk-autoposter-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    name: inspect-and-maybe-install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Check SSH secrets exist (values not printed)
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "$STAGING_HOST" ]; then echo "STAGING_HOST is empty"; missing=1; fi
          if [ -z "$STAGING_USER" ]; then echo "STAGING_USER is empty"; missing=1; fi
          if [ -z "$STAGING_SSH_KEY" ]; then echo "STAGING_SSH_KEY is empty"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "Cannot SSH. Refusing to continue."
            exit 1
          fi
          echo "SSH secret names are present. Values not logged."

      - name: Inspect VPS (no install)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 3m
          script_stop: true
          script: |
            set -euo pipefail
            echo "===== INSPECT BEGIN ====="
            echo "whoami=$(whoami)"
            echo "pwd=$(pwd)"
            uname -a
            echo "----- docker ps -----"
            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.RunningFor}}\t{{.Ports}}'
            echo "----- docker compose ls -----"
            docker compose ls
            echo "----- free -----"
            free -h
            echo "----- df -----"
            df -h
            echo "----- game health localhost:80 -----"
            echo -n "live="
            curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/health/live || echo fail
            echo
            echo -n "ready="
            curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/health/ready || echo fail
            echo
            echo "----- runner path -----"
            RUNNER_DIR=/home/deploy/actions-runner-vk-autoposter
            if [ -e "$RUNNER_DIR" ]; then
              echo "path_exists=yes"
              ls -la "$RUNNER_DIR"
              if [ -f "$RUNNER_DIR/.runner" ]; then
                echo "configured_runner=yes"
                echo "BOOTSTRAP_STATUS=runner_exists"
              else
                echo "configured_runner=no"
                echo "BOOTSTRAP_STATUS=dir_exists_unconfigured"
              fi
            else
              echo "path_exists=no"
              echo "configured_runner=no"
              echo "BOOTSTRAP_STATUS=ready_to_install"
            fi
            if systemctl list-unit-files --no-legend 2>/dev/null | grep -q '^github-actions-runner-vk-autoposter.service'; then
              echo "systemd_unit=present"
              systemctl is-active github-actions-runner-vk-autoposter.service || true
            else
              echo "systemd_unit=absent"
            fi
            docker ps -a --format '{{.ID}} {{.Names}} {{.Image}} {{.State}}' | sort > /tmp/vk-autoposter-bootstrap-docker-before.txt
            echo "----- docker snapshot -----"
            cat /tmp/vk-autoposter-bootstrap-docker-before.txt
            echo "===== INSPECT END ====="

      - name: Mint vk-autoposter registration token
        id: mint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VK_AUTOPOSTER_GITHUB_TOKEN: ${{ secrets.VK_AUTOPOSTER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${VK_AUTOPOSTER_GITHUB_TOKEN:-}" ]; then
            echo "::add-mask::${VK_AUTOPOSTER_GITHUB_TOKEN}"
          fi

          mint() {
            local tok="$1"
            local label="$2"
            if [ -z "$tok" ]; then
              echo "skip mint via ${label}: empty"
              return 1
            fi
            local resp http
            resp="$(mktemp)"
            http="$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${tok}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/mrkhx/vk-autoposter/actions/runners/registration-token || true)"
            if [ "$http" = "201" ]; then
              local rt
              rt="$(jq -r '.token // empty' "$resp")"
              rm -f "$resp"
              if [ -n "$rt" ]; then
                echo "::add-mask::${rt}"
                echo "RUNNER_TOKEN=${rt}" >> "$GITHUB_ENV"
                echo "minted=yes" >> "$GITHUB_OUTPUT"
                echo "mint_via=${label}" >> "$GITHUB_OUTPUT"
                echo "registration token minted via ${label} (value not logged)"
                return 0
              fi
              echo "mint via ${label}: HTTP 201 but empty token"
              return 1
            fi
            echo "mint via ${label}: HTTP ${http}"
            jq -r '.message // empty' "$resp" 2>/dev/null || true
            rm -f "$resp"
            return 1
          }

          echo "minted=no" >> "$GITHUB_OUTPUT"
          echo "mint_via=none" >> "$GITHUB_OUTPUT"
          if mint "$GITHUB_TOKEN" "GITHUB_TOKEN"; then
            exit 0
          fi
          if mint "${VK_AUTOPOSTER_GITHUB_TOKEN:-}" "VK_AUTOPOSTER_GITHUB_TOKEN"; then
            exit 0
          fi
          echo "CANNOT_MINT_REGISTRATION_TOKEN"
          echo "GITHUB_TOKEN of mrkhx/rybatskiy-mir is scoped to this repo and cannot create a runner registration token for private repo mrkhx/vk-autoposter."
          echo "Minimum extra credential: repository secret VK_AUTOPOSTER_GITHUB_TOKEN on mrkhx/rybatskiy-mir."
          echo "Fine-grained PAT (or GitHub App installation token) with:"
          echo "  repository access: ONLY mrkhx/vk-autoposter"
          echo "  permission: Administration = Read and write"
          echo "  (needed for POST /repos/mrkhx/vk-autoposter/actions/runners/registration-token)"
          echo "Do not use a classic PAT with org-wide or extra scopes."

      - name: Stop if registration token is missing
        if: ${{ steps.mint.outputs.minted != 'yes' }}
        run: |
          echo "Inspect finished. Install was not attempted."
          echo "Add secret VK_AUTOPOSTER_GITHUB_TOKEN on mrkhx/rybatskiy-mir (Administration:write on vk-autoposter only), then re-run this workflow."
          echo "Not deleting this temporary workflow yet because install did not succeed."
          exit 1

      - name: Install runner on VPS
        uses: appleboy/ssh-action@v1
        env:
          RUNNER_TOKEN: ${{ env.RUNNER_TOKEN }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 12m
          script_stop: true
          envs: RUNNER_TOKEN
          script: |
            set -euo pipefail
            RUNNER_DIR=/home/deploy/actions-runner-vk-autoposter
            RUNNER_NAME=vk-autoposter-vps
            REPO_URL=https://github.com/mrkhx/vk-autoposter
            UNIT_NAME=github-actions-runner-vk-autoposter.service
            VERSION=2.337.0

            echo "===== PRE-INSTALL GUARDS ====="
            case "$(pwd)" in
              *rybatskiy*) echo "refusing: cwd looks like the game"; exit 1 ;;
            esac
            if [ -d /opt/rybatskiy-mir ]; then
              echo "game dir present — will not modify it"
            fi
            if [ -f "$RUNNER_DIR/.runner" ]; then
              echo "BOOTSTRAP_STATUS=runner_exists"
              echo "configured runner already present; not deleting; stopping"
              exit 78
            fi
            if systemctl list-unit-files --no-legend 2>/dev/null | grep -q "^${UNIT_NAME}"; then
              echo "BOOTSTRAP_STATUS=service_exists"
              echo "systemd unit already present; not deleting; stopping"
              exit 78
            fi
            if [ -z "${RUNNER_TOKEN:-}" ]; then
              echo "RUNNER_TOKEN empty; refusing install"
              exit 1
            fi
            if ! sudo -n true 2>/dev/null; then
              echo "passwordless sudo is not available for systemd install"
              exit 1
            fi

            echo "===== DOWNLOAD OFFICIAL RUNNER ====="
            mkdir -p "$RUNNER_DIR"
            cd "$RUNNER_DIR"
            if [ ! -f ./config.sh ]; then
              tarball="actions-runner-linux-x64-${VERSION}.tar.gz"
              url="https://github.com/actions/runner/releases/download/v${VERSION}/${tarball}"
              echo "downloading official actions/runner v${VERSION}"
              curl -fsSL -o "$tarball" "$url"
              tar xzf "$tarball"
              rm -f "$tarball"
            fi

            echo "===== CONFIGURE (vk-autoposter only) ====="
            ./config.sh --unattended \
              --url "$REPO_URL" \
              --token "$RUNNER_TOKEN" \
              --name "$RUNNER_NAME" \
              --labels vk-autoposter \
              --work _work
            unset RUNNER_TOKEN

            echo "===== SYSTEMD UNIT ====="
            python3 -c 'open("/tmp/github-actions-runner-vk-autoposter.service","w").write("""[Unit]
Description=GitHub Actions Runner for mrkhx/vk-autoposter
After=network-online.target docker.service
Wants=network-online.target
Requires=docker.service

[Service]
Type=simple
User=deploy
Group=deploy
WorkingDirectory=/home/deploy/actions-runner-vk-autoposter
ExecStart=/bin/bash /home/deploy/actions-runner-vk-autoposter/runsvc.sh
Restart=always
RestartSec=10
KillMode=process
KillSignal=SIGTERM
TimeoutStopSec=5min
LimitNOFILE=65536
Environment=DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1

[Install]
WantedBy=multi-user.target
""")'
            sudo mv /tmp/github-actions-runner-vk-autoposter.service /etc/systemd/system/${UNIT_NAME}
            sudo chmod 644 /etc/systemd/system/${UNIT_NAME}
            if grep -q rybatskiy /etc/systemd/system/${UNIT_NAME}; then
              echo "refusing: unit file mentions the game"
              exit 1
            fi
            echo "unit file written without game paths"
            sudo systemctl daemon-reload
            sudo systemctl enable --now ${UNIT_NAME}

            echo "===== POSTCHECK ====="
            sleep 3
            systemctl status ${UNIT_NAME} --no-pager -L || true
            systemctl show ${UNIT_NAME} -p Id,ActiveState,SubState,MainPID,User,FragmentPath,WorkingDirectory --no-pager
            echo "----- docker ps after -----"
            docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Status}}\t{{.RunningFor}}\t{{.Ports}}'
            echo "----- docker compose ls after -----"
            docker compose ls
            docker ps -a --format '{{.ID}} {{.Names}} {{.Image}} {{.State}}' | sort > /tmp/vk-autoposter-bootstrap-docker-after.txt
            echo "----- docker diff (should be empty) -----"
            if ! diff -u /tmp/vk-autoposter-bootstrap-docker-before.txt /tmp/vk-autoposter-bootstrap-docker-after.txt; then
              echo "ERROR: docker container set changed during runner install"
              exit 1
            fi
            echo "docker set unchanged"
            echo -n "live="
            curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/health/live || echo fail
            echo
            echo -n "ready="
            curl -sS -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1/health/ready || echo fail
            echo
            echo "BOOTSTRAP_STATUS=installed"
            echo "===== INSTALL END ====="
