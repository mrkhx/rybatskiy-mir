# Staging deploy. Does not run on every bootstrap push.
# Default dispatch: verify + image build without push/SSH.
# First real deploy: workflow_dispatch with push_images=true AND deploy=true
# after GitHub Secrets and /opt/rybatskiy-mir/.env.staging exist.
# See docs/staging-first-deploy.md

name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (empty = git SHA)"
        required: false
        default: ""
      push_images:
        description: "Push images to GHCR (GITHUB_TOKEN)"
        type: boolean
        default: false
      deploy:
        description: "SSH deploy to staging (requires secrets + .env.staging on VPS)"
        type: boolean
        default: false
  push:
    tags:
      - "staging-*"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rybatskiy-mir

jobs:
  verify:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-local-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: build-images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      push_images: ${{ steps.meta.outputs.push }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and push flag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          PUSH=false
          if [ "${{ github.event_name }}" = "push" ] \
            || [ "${{ github.event.inputs.push_images }}" = "true" ] \
            || [ "${{ github.event.inputs.deploy }}" = "true" ]; then
            PUSH=true
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "Using image tag ${TAG} push=${PUSH}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ steps.meta.outputs.push == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:staging
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=/
            VITE_BASE=/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-admin:staging
          build-args: |
            VITE_ADMIN_API_URL=/api
            VITE_BASE=/admin/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/proxy.Dockerfile
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-proxy:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-proxy:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: ssh-deploy
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    if: ${{ github.event.inputs.deploy == 'true' }}
    steps:
      - name: Check staging secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          missing=0
          if [ -z "$STAGING_HOST" ]; then echo "STAGING_HOST is not configured"; missing=1; fi
          if [ -z "$STAGING_USER" ]; then echo "STAGING_USER is not configured"; missing=1; fi
          if [ -z "$STAGING_SSH_KEY" ]; then echo "STAGING_SSH_KEY is not configured"; missing=1; fi
          if [ -z "$GHCR_TOKEN" ]; then echo "GHCR_TOKEN is not configured"; missing=1; fi
          if [ "$missing" -ne 0 ]; then
            echo "See docs/secrets.md and docs/staging-first-deploy.md"
            exit 1
          fi

      - name: Checkout compose files
        uses: actions/checkout@v4

      - name: Copy compose and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          source: "docker-compose.staging.yml,scripts/staging-remote-deploy.sh"
          target: ${{ secrets.STAGING_APP_DIR || '/opt/rybatskiy-mir' }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ needs.images.outputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          APP_DIR: ${{ secrets.STAGING_APP_DIR }}
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USERNAME,APP_DIR
          script: |
            set -euo pipefail
            APP_DIR="${APP_DIR:-/opt/rybatskiy-mir}"
            chmod +x "$APP_DIR/scripts/staging-remote-deploy.sh"
            APP_DIR="$APP_DIR" \
              IMAGE_TAG="$IMAGE_TAG" \
              GHCR_TOKEN="$GHCR_TOKEN" \
              GHCR_USERNAME="${GHCR_USERNAME:-mrkhx}" \
              "$APP_DIR/scripts/staging-remote-deploy.sh"

      - name: Public health check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          set -euo pipefail
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors \
            "http://${STAGING_HOST}/health/live"
          echo
          ready_code="$(curl -sS -o /tmp/public-ready.json -w '%{http_code}' \
            --retry 10 --retry-delay 3 "http://${STAGING_HOST}/health/ready" || true)"
          if [ "$ready_code" != "200" ]; then
            echo "public readiness failed: HTTP ${ready_code}"
            cat /tmp/public-ready.json || true
            exit 1
          fi
          cat /tmp/public-ready.json
          echo
          curl -fsS -o /dev/null "http://${STAGING_HOST}/"
          curl -fsS -o /dev/null "http://${STAGING_HOST}/admin/"
          curl -fsS -o /dev/null "http://${STAGING_HOST}/api/health"
