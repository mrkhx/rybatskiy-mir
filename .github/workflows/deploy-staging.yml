# Staging deploy template.
# Default dispatch only runs verify + image builds (no push, no SSH).
# Push/deploy stay opt-in and no-op until GitHub Secrets are configured.
# See docs/deployment.md and docs/secrets.md.

name: Deploy staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (empty = git SHA)"
        required: false
        default: ""
      push_images:
        description: "Push images to GHCR"
        type: boolean
        default: false
      deploy:
        description: "SSH deploy to staging (requires secrets)"
        type: boolean
        default: false
  push:
    tags:
      - "staging-*"

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rybatskiy-mir

jobs:
  verify:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-local-test-secret-not-for-production
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: build-images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using image tag ${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-backend:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:staging
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=/
            VITE_BASE=/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/admin.Dockerfile
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-admin:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-admin:staging
          build-args: |
            VITE_ADMIN_API_URL=/api
            VITE_BASE=/admin/
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build proxy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/proxy.Dockerfile
          push: ${{ github.event_name == 'push' || github.event.inputs.push_images == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-proxy:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-proxy:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: ssh-deploy
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.inputs.deploy == 'true' }}
    steps:
      - name: Check staging secrets
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          if [ -z "$STAGING_HOST" ]; then
            echo "STAGING_HOST is not configured. Remote deploy is skipped until secrets exist."
            echo "See docs/secrets.md"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.STAGING_APP_DIR || '/opt/rybatskiy-mir' }}"
            TAG="${{ needs.images.outputs.image_tag }}"
            cd "$APP_DIR"
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME || github.actor }}" --password-stdin
            fi
            export IMAGE_TAG="$TAG"
            docker compose --env-file .env.staging -f docker-compose.staging.yml pull
            docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
            docker compose --env-file .env.staging -f docker-compose.staging.yml exec -T backend wget -qO- http://127.0.0.1:3000/health/ready
            echo "Staging deploy finished: $TAG"
